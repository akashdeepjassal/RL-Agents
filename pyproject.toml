[project]
name = "rl-agents-range-repair"
version = "0.1.0"
description = "A small coding-agent RL taskset for Prime Intellect Verifiers"
requires-python = ">=3.11,<3.15"
dependencies = [
  "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@e2253343056e2ed7507e67af48ebddfa4e3a7b96",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["range_repair"]
